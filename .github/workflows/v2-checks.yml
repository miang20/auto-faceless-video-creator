name: V2 Python Checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  syntax-and-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install FFmpeg for real render verification
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Compile Python modules
        run: python -m compileall -q app.py core tests
      - name: Check Termux recovery script syntax
        run: bash -n scripts/termux_recover_drawtext.sh
      - name: Run renderer and sequence tests
        run: |
          python -m pip install pytest
          python -m pytest -q
