name: Pro Editing Core Checks

on:
  push:
    branches: [main, "feature/pro-editing-core"]
  pull_request:
    branches: [main]

jobs:
  python-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m compileall -q core app.py
      - run: python -m unittest discover -s tests -v
